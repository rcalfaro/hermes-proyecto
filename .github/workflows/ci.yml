# =============================================================================
# CI del Gemelo Digital — Proceso Civil de Nicaragua (Ley 908)
#
# Disparadores: push/PR a main. Dos jobs en PARALELO (matriz de velocidad):
#   backend-tests : pytest determinista + ruff (linter PEP 8)
#   frontend-lint : tsc estricto + eslint + build (la UI nunca se publica rota)
# Job final docker-build: valida que compose y Dockerfiles construyen.
#
# Principio: los tests de plazos usan FakeClock -> no requieren db/redis reales;
# aun así subimos postgres:15-alpine como servicio para las pruebas de
# integración con auditoría SQL cuando existan (marcadas @pytest.mark.db).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs viejos del mismo branch: colas rápidas en juzgados con poco ancho.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # mínimo privilegio también en el pipeline

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 · Backend: pytest + ruff sobre Python 3.12 (misma versión del contenedor)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend · pytest + ruff
    runs-on: ubuntu-latest
    services:
      # Contenedor de prueba PostgreSQL 15 (espejo del servicio `db` del compose).
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_gemelo
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: gemelo_civil_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_gemelo -d gemelo_civil_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (con caché de pip)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt

      - name: Linter estático (PEP 8 / errores potenciales)
        working-directory: .
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Tests unitarios e integración (deterministas, < 10 s)
        env:
          DATABASE_URL: postgresql+psycopg://ci_gemelo:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/gemelo_civil_ci
        run: pytest -q --maxfail=1

  # ---------------------------------------------------------------------------
  # JOB 2 · Frontend: typecheck TS estricto + eslint + build
  # ---------------------------------------------------------------------------
  frontend-lint:
    name: Frontend · tsc + eslint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS (misma base que el Dockerfile)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Instalación reproducible (npm ci anclado al lockfile)
        run: npm ci --no-audit --no-fund

      - name: TypeScript estricto (--noEmit)
        run: npm run typecheck

      - name: ESLint (reglas de calidad UI)
        # --max-warnings 0: warnings = error en un sistema jurídico auditable.
        run: npx --yes eslint src --ext .ts,.tsx --max-warnings 0

      - name: Build de producción (falla si hay tipos rotos)
        run: npm run build

      - name: Smoke test SSR del tablero (sin navegador)
        run: npm run smoke:ssr --if-present

  # ---------------------------------------------------------------------------
  # JOB 3 · Infraestructura: valida que las imágenes construyen (smoke de release)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Infra · docker build smoke
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]   # solo si el código es verde
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx (caché entre runs)
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen backend (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: gemelo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar sintaxis/plan del docker-compose.yml
        # `config` interpola variables: detecta YAML inválido o envs faltantes.
        run: cp .env.example .env && docker compose config --quiet && echo "compose OK"
