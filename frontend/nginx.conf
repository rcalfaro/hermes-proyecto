# =============================================================================
# nginx.conf — servidor de la SPA + proxy inverso hacia la API FastAPI.
# Escucha en 3000 para mantener la convención del puerto del frontend.
# =============================================================================

server {
    listen       3000;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Seguridad de cabeceras (defense-in-depth para un sistema judicial) ---
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "no-referrer"        always;

    # --- Proxy inverso: el navegador habla SOLO con este origen (sin CORS) ---
    # El JWT viaja como Authorization: Bearer desde lib/api.ts; Nginx lo
    # reenvía tal cual al backend, que es la ÚNICA fuente de verdad (Zero Trust).
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Healthcheck del orquestador (no loggea ruido).
    location = /healthz {
        access_log off;
        return 200 '{"estado":"ok","servicio":"frontend"}';
        add_header Content-Type application/json;
    }

    # --- SPA fallback: rutas tipo /caso/{id} las resuelve React Router ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre -> cacheables agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
